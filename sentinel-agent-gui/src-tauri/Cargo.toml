[package]
name    = "sentinel-agent-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri        = { version = "2.0.0", features = ["protocol-asset"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
uuid         = { version = "1.8", features = ["v4", "serde"] }
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", features = ["json", "blocking"] }
dirs         = "5.0"
base64       = "0.22"
chrono       = { version = "0.4", features = ["serde"] }
lazy_static  = "1.5"
sha2         = "0.10"
md-5         = "0.10"
hex          = "0.4"
sentinel-carver = { path = "../../sentinel-carver" }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell  = "2.0.0"
tauri-plugin-os     = "2.0.0"

[build-dependencies]
tauri-build  = { version = "2.0.0", features = [] }

[profile.dev]
debug = 1                # Reduces PDB symbol size by ~80-90% on Windows
split-debuginfo = "packed" # Packs Windows PDB debug info cleanly

# Strip heavy debug symbols for external dependencies (windows, tokio, reqwest, tauri, etc.)
[profile.dev.package."*"]
opt-level = 2
debug = false

