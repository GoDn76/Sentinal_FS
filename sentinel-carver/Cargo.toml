[package]
name = "sentinel-carver"
version = "0.1.0"
edition = "2021"

[dependencies]
# Low-overhead raw disk/image memory mapping
memmap2 = "0.9"

# Cryptographic hashing (Section 63 BSA compliance)
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Timestamps and UUIDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

# API Client (blocking client for simple agent flow)
reqwest = { version = "0.12", features = ["multipart", "json", "blocking"] }